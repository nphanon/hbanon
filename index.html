<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>角色庆生</title>
<style>
*{box-sizing:border-box;font-family:system-ui;}
body{background:#fff0f6;text-align:center;padding:40px 20px;}
.box{max-width:500px;margin:0 auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 4px 12px #00000015;}
h1{color:#d63384;}
.count-num{font-size:48px;font-weight:bold;color:#c2255c;margin:20px 0;}
#btnBirth{padding:14px 32px;font-size:18px;border:none;border-radius:12px;background:#f06595;color:white;cursor:pointer;}
#btnBirth:disabled{background:#adb5bd;cursor:not-allowed;}
.tip{margin-top:16px;color:#666;}
</style>
</head>
<body>
<div class="box">
  <h1>🎂 为角色庆生</h1>
  <div>已有 <span class="count-num" id="countShow">0</span> 人庆生</div>
  <button id="btnBirth">点击庆生</button>
  <div class="tip" id="msgTip"></div>
</div>

<script>
const countShow = document.getElementById('countShow');
const btnBirth = document.getElementById('btnBirth');
const msgTip = document.getElementById('msgTip');

// 初始拉取数据
async function loadData(){
  const res = await fetch("/api/count");
  const data = await res.json();
  countShow.innerText = data.total;
  if(data.hasClicked){
    btnBirth.disabled = true;
    msgTip.innerText = "✅ 你已经完成庆生";
  }
}

btnBirth.onclick = async ()=>{
  btnBirth.disabled = true;
  msgTip.innerText = "提交中…";
  const res = await fetch("/api/count",{method:"POST"});
  const ret = await res.json();
  countShow.innerText = ret.total;
  msgTip.innerText = ret.msg;
};

loadData();
</script>
</body>
</html>
